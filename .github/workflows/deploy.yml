# Deploy automatico: a ogni push su main costruisce le immagini dei tre siti e le
# porta sul server, poi `docker compose up -d` riavvia solo i container cambiati.
# E' lo stesso flusso manuale (publish.ps1 + docker save/load), automatizzato.
#
# Porta anche i contesti di build che stanno nel repo (Caddy e tileserver): il
# `--build` del riavvio ricostruisce l'immagine solo se e' cambiato qualcosa.
#
# NON tocca: docker-compose/.env e mailcow — restano manuali (contengono
# segreti e cambiano di rado). Se cambia l'AppHost/compose, deploy a mano.
#
# Segreti usati (impostati via `gh secret set`):
#   DEPLOY_SSH_KEY   — chiave privata dedicata per ubuntu@server (la pubblica e'
#                      in authorized_keys sul server; NON e' la chiave .ppk di Matteo)
#   FE_SUBMODULE_KEY — deploy key read-only del repo privato matteofabbri.org-FE
#                      (ex maddelena-FE, ricreato il 2026-07-24), serve solo a
#                      scaricare il submodule del frontend
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Mai due deploy sovrapposti; quello in corso finisce, il nuovo aspetta.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  SERVER: ubuntu@ns347806.ip-5-196-91.eu

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Il submodule maddelena-FE e' privato: il token del workflow non lo vede,
      # si scarica via SSH con la sua deploy key. E' l'UNICO submodule che serve:
      # SPERONE e PredicitiveCoding non li referenzia piu' nessuno dei tre siti.
      - name: Checkout submodule frontend
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.FE_SUBMODULE_KEY }}" > ~/.ssh/fe_key
          chmod 600 ~/.ssh/fe_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git submodule init external/maddelena-FE
          git config submodule.external/maddelena-FE.url git@github.com:matteofabbri/matteofabbri.org-FE.git
          GIT_SSH_COMMAND="ssh -i ~/.ssh/fe_key -o IdentitiesOnly=yes" \
            git submodule update external/maddelena-FE

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Node per la build Vite del frontend (target BuildSpa nel csproj di
      # Maddalena: fa da solo npm install + npm run build).
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build immagini
        run: |
          dotnet publish MainSite/MainSite.csproj  /t:PublishContainer /p:ContainerRepository=matteofabbri-site     /p:ContainerImageTag=latest
          dotnet publish TheQult/TheQult.csproj    /t:PublishContainer /p:ContainerRepository=matteofabbri-theqult  /p:ContainerImageTag=latest
          dotnet publish Maddalena/Maddalena.csproj /t:PublishContainer /p:ContainerRepository=matteofabbri-maddalena /p:ContainerImageTag=latest

      - name: Chiave SSH del server
        run: |
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Host key del server fissata qui (e' pubblica): niente "trust on first use".
          echo 'ns347806.ip-5-196-91.eu ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDj21IMc/CsStOgBOQY5nsfHbc130zAtzaUBZhVEtVWO' >> ~/.ssh/known_hosts

      - name: Trasferimento immagini
        run: |
          for img in matteofabbri-site matteofabbri-theqult matteofabbri-maddalena; do
            docker save "$img:latest" | gzip | \
              ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$SERVER" 'gunzip | sudo docker load'
          done

      # I contesti di build che vivono nel repo: Caddy e tileserver (quest'ultimo
      # e' l'immagine che si scarica la mappa del mondo da sola all'avvio).
      # Passano dalla home perche' ubuntu non scrive in /opt, poi sudo li mette
      # al loro posto accanto al compose.
      - name: Aggiornamento contesti di build
        run: |
          for ctx in caddy tileserver valhalla; do
            ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$SERVER" "rm -rf ~/$ctx-new"
            scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -r \
              "MatteoFabbri.org.AppHost/$ctx" "$SERVER:~/$ctx-new"
            ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$SERVER" \
              "sudo mkdir -p /opt/matteofabbri/$ctx && sudo cp -r ~/$ctx-new/. /opt/matteofabbri/$ctx/ && rm -rf ~/$ctx-new"
          done

      # up -d --build ricrea SOLO i container cambiati (immagine nuova o contesto
      # Caddy cambiato); il prune butta le immagini vecchie rimaste senza tag
      # (sennò il disco si riempie).
      - name: Riavvio container e pulizia
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$SERVER" \
            'cd /opt/matteofabbri && sudo docker compose up -d --build && sudo docker image prune -f'

      # Solo maddalena.me: gli altri due domini non hanno ancora il DNS puntato qui.
      - name: Verifica
        run: |
          sleep 5
          curl -fsS -o /dev/null -w 'maddalena.me %{http_code}\n' https://maddalena.me/
