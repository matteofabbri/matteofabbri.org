# ============================================================================
# Override per mailcow-dockerized — aggancio alla rete condivisa "matteo-shared"
# ============================================================================
#
# COSA FA
#   Affaccia i container di mailcow che ci servono sul "corridoio" comune,
#   cosi' lo stack generato da Aspire (Caddy + sito) puo' parlargli per nome:
#     - nginx-mailcow   -> la webmail, raggiunta da Caddy   (mail.maddalena.me)
#     - postfix-mailcow -> invio mail dal sito (SMTP submission 587)
#     - dovecot-mailcow -> (opzionale) lettura caselle dal sito (IMAP)
#
# COME SI USA
#   1) Una volta sola, crea la rete "neutra" (di proprieta' di nessuno stack):
#        docker network create matteo-shared
#   2) Copia questo file nella cartella di mailcow-dockerized, accanto al suo
#      docker-compose.yml, col nome  docker-compose.override.yml
#   3) (ri)avvia mailcow:  docker compose up -d
#
# NOTE
#   - L'override AGGIUNGE solo la rete matteo-shared: la rete interna di mailcow
#     (mailcow-network) resta intatta, viene unita per chiave.
#   - Il nome del servizio fa gia' da alias sulla rete: Caddy raggiunge la
#     webmail come "nginx-mailcow", il sito invia via "postfix-mailcow:587".
#   - La porta interna della nginx e la condivisione del certificato si
#     definiscono al Passo 3 (reverse proxy mailcow + cert condiviso con Caddy).

services:
  nginx-mailcow:
    networks:
      matteo-shared:
        aliases:
          - nginx-mailcow

  postfix-mailcow:
    networks:
      matteo-shared:
        aliases:
          - postfix-mailcow

  # Scommenta se il sito deve LEGGERE le caselle via IMAP (oltre a inviare).
  # dovecot-mailcow:
  #   networks:
  #     matteo-shared:
  #       aliases:
  #         - dovecot-mailcow

networks:
  matteo-shared:
    external: true
