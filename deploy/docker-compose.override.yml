# Override of the site compose, applied automatically by `docker compose`
# in /opt/matteofabbri.
#
# It gives MainSite:
#  - blog posts and images in the blog-data volume, not in the image; without
#    the mount every deploy would delete the posts;
#  - the embedded Sperone request-log database in the request-log-data volume,
#    mounted at /data/sperone, for the same reason;
#  - the GeoIP database (DB-IP Lite, refreshed by deploy/update-geoip.sh) in
#    /opt/matteofabbri/geoip, mounted read-only at /data/geoip;
#  - the container runs as user `app` (UID 1654), so the deploy workflow
#    creates the volumes and chowns them to 1654 before starting the site;
#  - TheQult (theqult.org) keeps profiles, stays and references in the
#    theqult-data volume, mounted at /data/theqult: a deploy does not wipe the
#    community. No secret to configure.
#  - the local accounts (username/password) live in the auth-data volume,
#    mounted at /data/auth. On a brand-new install the first account is created
#    from AUTH_BOOTSTRAP_USERNAME/AUTH_BOOTSTRAP_PASSWORD; once one exists the
#    bootstrap values are ignored and can be removed.
#  - the Umami tracker is configured here: it lives under /analytics on the
#    main site, so the script URL is <SITE_DOMAIN>/analytics/script.js; the
#    website id comes from UMAMI_WEBSITE_ID (created in the Umami dashboard;
#    empty = no tracker on the site).
#
# Booking is UNCONFIGURED: its backend was the mailcow stack (SOGo CalDAV) and
# it is not part of this stack any more; the booking API answers 503. Blog
# sign-in is LOCAL (auth-data), no external identity provider is involved.
services:
  site:
    environment:
      Blog__ContentPath: /data/blog
      Auth__DatabasePath: /data/auth/auth.db
      Auth__BootstrapUsername: ${AUTH_BOOTSTRAP_USERNAME:-}
      Auth__BootstrapPassword: ${AUTH_BOOTSTRAP_PASSWORD:-}
      Auth__BootstrapDisplayName: ${AUTH_BOOTSTRAP_DISPLAY_NAME:-}
      Umami__ScriptUrl: https://${SITE_DOMAIN:-matteofabbri.org}/analytics/script.js
      Umami__WebsiteId: ${UMAMI_WEBSITE_ID:-}
      RequestLog__Path: /data/sperone
      RequestLog__GeoIpDatabasePath: /data/geoip/dbip-city-lite.mmdb
      # Il modello che etichetta le richieste. Se il container AI non è su, il
      # sito scrive il log lo stesso e i flag restano null.
      BotDetection__GrpcUrl: http://bot-ai:50051
      # Backfill delle righe già in Sperone. Il marker in
      # /data/sperone/bot-backfill.json fa ripartire solo le righe mancanti.
      RequestLog__BackfillBotFlags: "true"
      # One-shot rebuild of the scalar indexes from the payloads, after the
      # corrupt-store drop. The marker in /data/sperone makes it a single pass.
      RequestLog__ReindexIndexes: "true"
    volumes:
      - blog-data:/data/blog
      - auth-data:/data/auth
      - request-log-data:/data/sperone
      - /opt/matteofabbri/geoip:/data/geoip:ro

  # Python inference service. The generated compose puts every service on the
  # "aspire" network: without this line the container lands on the default
  # network, the site cannot resolve bot-ai and gRPC returns Unavailable.
  bot-ai:
    image: matteofabbri-bot-ai:latest
    restart: unless-stopped
    networks:
      - aspire
    volumes:
      - botdetection-models:/models
      - botdetection-data:/data

  theqult:
    environment:
      TheQult__DataPath: /data/theqult
    volumes:
      - theqult-data:/data/theqult

volumes:
  blog-data:
  auth-data:
  request-log-data:
  theqult-data:
  botdetection-models:
  botdetection-data:
