# Override del compose del sito, applicato automaticamente da `docker compose`
# nella cartella /opt/matteofabbri.
#
# Serve al blog di MainSite:
#  - gli articoli e le immagini stanno nel volume blog-data, non nell'immagine;
#    senza il mount ogni deploy cancellerebbe i post;
#  - il container gira come utente `app` (UID 1654), quindi il workflow di
#    deploy crea il volume e lo chowna a 1654 prima di avviare il sito;
#  - le variabili Blog__Auth__* e Blog__Authors arrivano dal .env del server:
#    finché sono vuote l'area di scrittura resta spenta, il blog è leggibile.
services:
  site:
    environment:
      Blog__ContentPath: /data/blog
      Blog__Authors: ${BLOG_AUTHORS:-}
      Blog__Auth__BaseUrl: ${MAILCOW_OAUTH_URL:-https://mail.maddalena.me}
      Blog__Auth__ClientId: ${MAILCOW_OAUTH_CLIENT_ID:-}
      Blog__Auth__ClientSecret: ${MAILCOW_OAUTH_CLIENT_SECRET:-}
    volumes:
      - blog-data:/data/blog

volumes:
  blog-data:
