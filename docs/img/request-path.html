<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>One request, two records</title>
<style>
  html, body { margin: 0; padding: 0; background: #fbfaf7; }
  svg { display: block; }
  text { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #1c1b19; }
  .title { font-size: 38px; font-weight: 700; letter-spacing: -0.6px; }
  .subtitle { font-size: 16px; fill: #6b6862; }
  .node-title { font-size: 21px; font-weight: 600; }
  .node-title-sm { font-size: 18px; font-weight: 600; }
  .body { font-size: 14px; fill: #4a4742; }
  .mono { font-family: "Cascadia Mono", Consolas, monospace; font-size: 12.5px; fill: #6b6862; }
  .label { font-size: 13px; fill: #6b6862; }
  .eyebrow { font-size: 12px; fill: #206f68; letter-spacing: 1.2px; font-weight: 700; }
  .node { fill: #ffffff; stroke: #e5e1d8; stroke-width: 1.5; }
  .node-accent { fill: #eef5f3; stroke: #206f68; stroke-width: 1.7; }
  .node-store { fill: #f4f1ea; stroke: #ddd7ca; stroke-width: 1.4; }
  .pill { fill: #ffffff; stroke: #e5e1d8; stroke-width: 1.4; }
  .edge { fill: none; stroke: #8c8880; stroke-width: 1.6; }
  .edge-accent { fill: none; stroke: #206f68; stroke-width: 1.8; stroke-dasharray: 7 6; }
  .divider { stroke: #ddd7ca; stroke-width: 1.3; stroke-dasharray: 3 6; }
  .lane { font-size: 12px; fill: #206f68; letter-spacing: 1.2px; font-weight: 700; }
</style>
</head>
<body>
<svg width="1400" height="820" viewBox="0 0 1400 820" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8c8880"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#206f68"/>
    </marker>
  </defs>

  <text x="60" y="52" class="eyebrow">MATTEOFABBRI.ORG / OBSERVABILITY</text>
  <text x="60" y="96" class="title">One request, two records</text>
  <text x="60" y="126" class="subtitle">The server-side log and the analytics tracker never meet: different stores, different questions, no shared key.</text>

  <!-- Lane A: server log -->
  <text x="60" y="172" class="lane">SERVER-SIDE · SPERONE</text>

  <rect class="pill" x="60" y="190" width="190" height="60" rx="20"/>
  <text x="155" y="226" text-anchor="middle" class="body">visitor / crawler</text>

  <rect class="node" x="310" y="178" width="190" height="84" rx="12"/>
  <text x="336" y="212" class="node-title-sm">Caddy</text>
  <text x="336" y="238" class="mono">TLS · PROXY protocol</text>

  <rect class="node" x="560" y="158" width="300" height="124" rx="12"/>
  <text x="586" y="192" class="node-title">site</text>
  <text x="586" y="214" class="mono">MainSite · RequestLogMiddleware</text>
  <text x="586" y="240" class="body">response is sent first,</text>
  <text x="586" y="262" class="body">the log entry is enqueued.</text>

  <rect class="pill" x="920" y="190" width="170" height="60" rx="20"/>
  <text x="1005" y="226" text-anchor="middle" class="body">HTML / 200</text>

  <path class="edge" d="M250 220 H310" marker-end="url(#arrow)"/>
  <text x="258" y="210" class="label">request</text>

  <path class="edge" d="M500 220 H560" marker-end="url(#arrow)"/>
  <text x="552" y="214" text-anchor="end" class="label">PROXY IP</text>

  <path class="edge" d="M860 220 H920" marker-end="url(#arrow)"/>
  <text x="862" y="180" class="label">responds first</text>

  <path class="edge" d="M710 282 V330" marker-end="url(#arrow)"/>
  <text x="722" y="312" class="label">entry</text>

  <rect class="node" x="560" y="330" width="200" height="86" rx="12"/>
  <text x="586" y="363" class="node-title-sm">queue</text>
  <text x="586" y="386" class="body">8,192 entries</text>
  <text x="586" y="406" class="body">drops on overflow</text>

  <path class="edge" d="M760 373 H810" marker-end="url(#arrow)"/>
  <text x="766" y="363" class="label">batch</text>

  <rect class="node" x="810" y="330" width="200" height="86" rx="12"/>
  <text x="836" y="363" class="node-title-sm">writer</text>
  <text x="836" y="386" class="body">1 s or 200 rows</text>
  <text x="836" y="406" class="body">background service</text>

  <path class="edge" d="M1010 373 H1060" marker-end="url(#arrow)"/>
  <text x="1016" y="355" class="label">write</text>

  <rect class="node-accent" x="1060" y="310" width="280" height="136" rx="12"/>
  <text x="1086" y="344" class="node-title">Sperone</text>
  <text x="1086" y="366" class="mono">embedded · same process</text>
  <text x="1086" y="392" class="body">requests collection · 90 days</text>
  <text x="1086" y="414" class="body">IP · user agent · country · client</text>
  <text x="1086" y="430" class="body">IsBot · IsMaliciousURL · model</text>

  <path class="edge" d="M1200 446 V474" marker-end="url(#arrow)"/>
  <rect class="pill" x="1100" y="474" width="200" height="56" rx="18"/>
  <text x="1200" y="507" text-anchor="middle" class="body">/requests</text>

  <!-- Divider -->
  <line class="divider" x1="60" y1="566" x2="1340" y2="566"/>
  <rect x="420" y="550" width="560" height="32" rx="8" fill="#fbfaf7"/>
  <text x="700" y="571" text-anchor="middle" class="label">One visit = two unrelated records · no shared key</text>

  <!-- Lane B: browser analytics -->
  <text x="60" y="622" class="lane">BROWSER-SIDE · UMAMI</text>

  <rect class="pill" x="60" y="640" width="190" height="60" rx="20"/>
  <text x="155" y="676" text-anchor="middle" class="body">browser</text>

  <rect class="node" x="310" y="628" width="210" height="84" rx="12"/>
  <text x="336" y="662" class="node-title-sm">tracker</text>
  <text x="336" y="684" class="mono">/analytics/script.js</text>

  <rect class="node" x="580" y="628" width="230" height="84" rx="12"/>
  <text x="606" y="662" class="node-title-sm">/analytics/api/send</text>
  <text x="606" y="684" class="mono">page view · no cookies</text>

  <rect class="node" x="870" y="616" width="210" height="108" rx="12"/>
  <text x="896" y="650" class="node-title-sm">umami</text>
  <text x="896" y="672" class="mono">BASE_PATH=/analytics</text>
  <text x="896" y="696" class="body">Postgres for storage</text>

  <rect class="node-store" x="1140" y="628" width="200" height="84" rx="12"/>
  <text x="1166" y="662" class="node-title-sm">umami-db</text>
  <text x="1166" y="684" class="mono">postgres:15-alpine</text>

  <path class="edge" d="M250 670 H310" marker-end="url(#arrow)"/>
  <text x="258" y="660" class="label">page view</text>

  <path class="edge" d="M520 670 H580" marker-end="url(#arrow)"/>
  <text x="528" y="660" class="label">POST</text>

  <path class="edge" d="M810 670 H870" marker-end="url(#arrow)"/>
  <text x="818" y="660" class="label">event</text>

  <path class="edge" d="M1080 670 H1140" marker-end="url(#arrow)"/>
  <text x="1088" y="660" class="label">a row</text>

  <text x="60" y="762" class="body">Sperone answers “what hit the server”. Umami answers “what the browser reported”.</text>
  <text x="60" y="786" class="body">Different questions, different retention rules, and no identifier that joins them.</text>
  <text x="1340" y="786" text-anchor="end" class="mono">one visit → two rows in two databases</text>
</svg>
</body>
</html>
